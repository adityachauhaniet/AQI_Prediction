{% extends 'base.html' %}

{% block title %}Report Details{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reports.css') }}">
{% endblock %}

{% block content %}

<div class="container2">

    <div class="report-card">

        <div class="report-data">
            <h2 class="section-title">Report Details</h2>
        
            <div class="report-header">
                <h3>{{ report.title }}</h3>
                <span class="report-year">{{ report.year }}</span>
            </div>

            <p class="report-description">{{ report.description }}</p>
        </div>

        <div class="download-card">
            <h3>Download Report</h3>

            <form method="POST" action="{{ url_for('pages.download_report', report_id=report.id) }}">
                
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="input-box" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="input-box" required>

                <label for="organization">Organisation</label>
                <input type="text" id="organization" name="organization" class="input-box" required>

                <button type="submit" class="btn">
                    Download PDF
                </button>

            </form>
        </div>

        {% if session.get('role') == 'admin' %}
        <div class="delete-report">
            <form method="POST"
                  action="{{ url_for('pages.delete_report', report_id=report.id) }}"
                  onsubmit="return confirm('Are you sure you want to delete this report?');">

                <button type="submit" class="delete-btn">
                    Delete Report
                </button>
            </form>
        </div>
        {% endif %}

    </div>

</div>

{% endblock %}
